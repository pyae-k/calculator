    <nav class="calc-tabs" role="tablist" aria-label="Calculator mode">
      <button class="calc-tab" role="tab" data-tab="calc" aria-selected="true" aria-controls="tab-calc" id="tab-calc-btn">Basic</button>

    <!-- ====== Calculator Panel ====== -->
    <section id="tab-calc" class="calc-panel" role="tabpanel" aria-labelledby="tab-calc-btn">
      <div class="calc-display-wrap">
        <output id="calc-expression" class="calc-expression" aria-live="polite"></output>
        <output id="calc-display" class="calc-display" aria-live="polite">0</output>
      </div>

      <div class="calc-mem-row">
        <button class="calc-btn calc-btn--mem" data-action="mc" aria-label="Memory clear">MC</button>
        <button class="calc-btn calc-btn--mem" data-action="mr" aria-label="Memory recall">MR</button>
        <button class="calc-btn calc-btn--mem" data-action="mplus" aria-label="Memory add">M+</button>
        <button class="calc-btn calc-btn--mem" data-action="mminus" aria-label="Memory subtract">M−</button>
      </div>

      <div class="calc-sci-row">
        <button class="calc-btn calc-btn--mem" data-action="sciToggle" aria-expanded="false" aria-controls="calc-sci-grid" aria-label="Toggle scientific functions" title="Scientific functions (keyboard: s c t l n g a x e p ! v)">SCI</button>
        <button class="calc-btn calc-btn--mem" data-action="angleMode" aria-pressed="false" aria-label="Toggle angle mode between degrees and radians" title="Angle mode: degrees or radians (keyboard: d)">DEG</button>
      </div>

      <div id="calc-sci-grid" class="calc-sci-grid" hidden>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="sin" aria-label="Sine">sin</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="cos" aria-label="Cosine">cos</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="tan" aria-label="Tangent">tan</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="asin" aria-label="Arcsine">sin⁻¹</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="acos" aria-label="Arccosine">cos⁻¹</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="atan" aria-label="Arctangent">tan⁻¹</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="log" aria-label="Base-10 logarithm">log</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="ln" aria-label="Natural logarithm">ln</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="log2" aria-label="Base-2 logarithm">log₂</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="abs" aria-label="Absolute value">|x|</button>
        <button class="calc-btn calc-btn--fn" data-action="fn" data-value="exp" aria-label="Exponential e to the x">eˣ</button>
        <button class="calc-btn calc-btn--fn" data-action="factorial" aria-label="Factorial">x!</button>
        <button class="calc-btn calc-btn--fn" data-action="nthroot" aria-label="Nth root">x√y</button>
        <button class="calc-btn calc-btn--fn" data-action="const" data-value="e" aria-label="Euler's number">e</button>
        <button class="calc-btn calc-btn--fn" data-action="const" data-value="pi" aria-label="Pi">π</button>
        <button class="calc-btn calc-btn--fn" data-action="const" data-value="tau" aria-label="Tau">τ</button>
        <button class="calc-btn calc-btn--fn" data-action="lparen" aria-label="Left parenthesis">(</button>
        <button class="calc-btn calc-btn--fn" data-action="rparen" aria-label="Right parenthesis">)</button>
      </div>

      <div id="calc-grid" class="calc-grid">
        <button class="calc-btn calc-btn--fn" data-action="sqrt" aria-label="Square root">&radic;</button>
        <button class="calc-btn calc-btn--fn" data-action="square" aria-label="Square">x&sup2;</button>
        <button class="calc-btn calc-btn--fn" data-action="cube" aria-label="Cube">x&sup3;</button>
        <button class="calc-btn calc-btn--fn" data-action="pow" aria-label="Power">x<sup>y</sup></button>

        <button class="calc-btn calc-btn--fn" data-action="recip" aria-label="Reciprocal"><sup>1</sup>/<sub>x</sub></button>
        <button class="calc-btn calc-btn--op" data-action="clear" aria-label="Clear all">C</button>
        <button class="calc-btn calc-btn--op" data-action="clearEntry" aria-label="Clear entry">CE</button>
        <button class="calc-btn calc-btn--op" data-action="op" data-value="/" aria-label="Divide">&divide;</button>

        <button class="calc-btn" data-action="digit" data-value="7" aria-label="7">7</button>
        <button class="calc-btn" data-action="digit" data-value="8" aria-label="8">8</button>
        <button class="calc-btn" data-action="digit" data-value="9" aria-label="9">9</button>
        <button class="calc-btn calc-btn--op" data-action="op" data-value="*" aria-label="Multiply">&times;</button>

        <button class="calc-btn" data-action="digit" data-value="4" aria-label="4">4</button>
        <button class="calc-btn" data-action="digit" data-value="5" aria-label="5">5</button>
        <button class="calc-btn" data-action="digit" data-value="6" aria-label="6">6</button>
        <button class="calc-btn calc-btn--op" data-action="op" data-value="-" aria-label="Subtract">&minus;</button>

        <button class="calc-btn" data-action="digit" data-value="1" aria-label="1">1</button>
        <button class="calc-btn" data-action="digit" data-value="2" aria-label="2">2</button>
        <button class="calc-btn" data-action="digit" data-value="3" aria-label="3">3</button>
        <button class="calc-btn calc-btn--op" data-action="op" data-value="+" aria-label="Add">+</button>

        <button class="calc-btn" data-action="sign" aria-label="Toggle sign">&plusmn;</button>
        <button class="calc-btn" data-action="digit" data-value="0" aria-label="0">0</button>
        <button class="calc-btn" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="calc-btn calc-btn--eq" data-action="eq" aria-label="Equals">=</button>
      </div>
    </section>

    <!-- ====== Converter Panel ====== -->
    <section id="tab-convert" class="calc-panel" role="tabpanel" aria-labelledby="tab-convert-btn" hidden>
      <div class="conv-row">
        <select id="conv-category" class="conv-select" aria-label="Conversion category"></select>
        <button id="conv-refresh" class="conv-refresh-btn" hidden aria-label="Refresh exchange rates" title="Refresh exchange rates">↻</button>
      </div>

      <label class="conv-label" for="conv-from">From</label>
      <div class="conv-row">
        <select id="conv-from" class="conv-select" aria-label="From unit"></select>
        <input type="number" id="conv-input" class="conv-input" inputmode="decimal" aria-label="Value to convert" placeholder="Enter value" />
      </div>

      <div class="conv-swap">
        <button id="conv-swap" class="conv-swap-btn" aria-label="Swap units" title="Swap units">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 16l-4-4 4-4"/><path d="M17 8l4 4-4 4"/><path d="M3 12h18"/>
          </svg>
        </button>
      </div>

      <label class="conv-label" for="conv-to">To</label>
      <div class="conv-row">
        <select id="conv-to" class="conv-select" aria-label="To unit"></select>
        <input type="number" id="conv-output" class="conv-input" inputmode="decimal" aria-label="Converted value" placeholder="Result" readonly />
      </div>
    </section>

    <!-- ====== Health Panel ====== -->
    <section id="tab-health" class="calc-panel" role="tabpanel" aria-labelledby="tab-health-btn" hidden>
      <select id="health-type" class="health-type-select" aria-label="Health calculator"></select>
      <div id="health-fields"></div>
      <div id="bmi-visual" hidden>
        <div id="bmi-bar-wrap" class="bmi-bar">
          <div id="bmi-marker" class="bmi-bar__marker" style="left:50%"></div>
        </div>
        <div class="bmi-labels" id="bmi-labels">
          <span>Underweight</span>
          <span>Normal</span>
          <span>Overweight</span>
          <span>Obese</span>
        </div>
      </div>
    </section>

    <!-- ====== Tools Panel ====== -->
    <section id="tab-tools" class="calc-panel" role="tabpanel" aria-labelledby="tab-tools-btn" hidden>
      <nav class="tools-subnav" role="tablist" aria-label="Tool type">
        <button class="tools-tab" role="tab" data-tool="percentage" aria-selected="true">Percentage</button>
        <button class="tools-tab" role="tab" data-tool="date" aria-selected="false">Date</button>
        <button class="tools-tab" role="tab" data-tool="tip" aria-selected="false">Tip</button>
        <button class="tools-tab" role="tab" data-tool="loan" aria-selected="false">Loan</button>
        <button class="tools-tab" role="tab" data-tool="compound" aria-selected="false">Compound</button>
        <button class="tools-tab" role="tab" data-tool="savings" aria-selected="false">Savings</button>
        <button class="tools-tab" role="tab" data-tool="tax" aria-selected="false">Tax</button>
        <button class="tools-tab" role="tab" data-tool="salary" aria-selected="false">Salary</button>
        <button class="tools-tab" role="tab" data-tool="quadratic" aria-selected="false">Quadratic</button>
        <button class="tools-tab" role="tab" data-tool="base" aria-selected="false">Base</button>
      </nav>
      <div id="tool-fields"></div>
    </section>

    <!-- ====== Shared Result Area ====== -->
    <section id="result-area" class="calc-result" aria-live="polite">
      <button id="result-copy" class="result-copy" aria-label="Copy result to clipboard" title="Copy result to clipboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <div id="result-value" class="result-value"></div>
      <p id="result-formula" class="result-formula"></p>
      <p id="result-source" class="result-source"></p>
      <p id="result-interpretation" class="result-interpretation" hidden></p>
    </section>

    <!-- ====== History ====== -->
    <section id="history-area" class="calc-history" aria-label="Calculation history">
      <h3>History</h3>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>
